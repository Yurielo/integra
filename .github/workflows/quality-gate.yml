name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Proposed Baseline Lite verifies exact CURRENT → A → B Git lineage.
          fetch-depth: 0
          # Validate the declared proposal commit, never GitHub's synthetic PR
          # merge ref (which would alter the declaration-only parent check).
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          # Matches the hashlocked Linux wheels and avoids the pre-3.13
          # conditional typing-extensions dependency of referencing.
          python-version: "3.13"
      - name: Validate governance state
        run: python3 scripts/validate_governance.py
      - name: Run tests
        # Actual Draft 2020-12 legacy/new translation contract checks use the
        # accepted review versions with exact Linux wheel hashes.
        # The separate macOS wheel-hash cache is unchanged.
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps -r scripts/review-ci-requirements.txt
          python3 -m unittest discover -s tests -v
